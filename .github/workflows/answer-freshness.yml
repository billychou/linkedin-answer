# 答案新鲜度哨兵：所有更新任务跑完后，检查 7 款游戏今天是否都有新答案。
# 缺失时自动开/更新告警 issue（label: data-alert），全部恢复后自动关闭。
#
# UTC 13:30 = 北京时间 21:30，晚于全部游戏的兜底重跑（最晚 13:00 UTC）。

name: Answer Freshness Sentinel

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: answer-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check today's coverage
        id: check
        # 默认 shell 已带 -eo pipefail，脚本退出码 1 会让本步失败并继续后续步骤
        run: python scripts/check_freshness.py | tee freshness_report.txt

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.CHECK_OUTCOME === 'success';
            const report = fs.existsSync('freshness_report.txt')
              ? fs.readFileSync('freshness_report.txt', 'utf8')
              : '(无报告输出)';
            const title = '[freshness] 当日答案覆盖不足';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-alert',
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title.startsWith('[freshness]'));

            if (ok) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `✅ 7/7 游戏当日均有新答案，覆盖恢复正常（run: ${runUrl}），自动关闭。`,
                });
                await github.rest.issues.updateIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              core.info('新鲜度检查通过：7/7 游戏均已有今日答案。');
              return;
            }

            const body = [
              '当日答案覆盖不足 7/7，以下游戏今天没有新答案（详见检查报告）。',
              '请优先检查对应游戏的更新 workflow 是否失败（源站改版/反爬是常见原因）。',
              '',
              '```',
              report,
              '```',
              '',
              `- 检查运行: ${runUrl}`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `❌ ${new Date().toISOString().slice(0, 10)} 检查仍未通过:\n\`\`\`\n${report}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-alert'],
              });
            }
            core.setFailed('新鲜度检查未通过，已开/更新告警 issue。');
