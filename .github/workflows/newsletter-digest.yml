# 每日答案摘要邮件触发器。
#
# 调用部署站点的 /api/newsletter/digest（Cloudflare Pages Function），
# 由 Functions 查询 D1 订阅表并经 Resend 逐个发送。
#
# 依赖配置：
#   - GitHub 仓库 secret：NEWSLETTER_CRON_SECRET（与 Pages 环境变量同名同值）
#   - GitHub 仓库 variable：NEXT_PUBLIC_SITE_URL（可选，默认生产域名）
# 端点未配置 NEWSLETTER_CRON_SECRET 时返回 503，本任务视为成功跳过。

name: Daily Newsletter Digest

on:
  schedule:
    # UTC 14:30 = 北京时间 22:30 = 美东上午；此时当日答案已全部发布。
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger digest endpoint
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "NEWSLETTER_CRON_SECRET 未配置，跳过摘要发送。"
            exit 0
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${SITE_URL:-https://linkedinanswer.today}/api/newsletter/digest" \
            -H "x-cron-secret: $CRON_SECRET")
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP $code: $body"
          if [ "$code" = "503" ]; then
            echo "端点未启用（密钥未配置），视为成功跳过。"
            exit 0
          fi
          [ "$code" = "200" ]
