# 每日定时抓取当日 Pinpoint 答案并自动提交到 main。
#
# 注意：GitHub Actions 的 cron 表达式使用 UTC 时间。
#   08:30 UTC = 北京时间 16:30 (UTC+8)
# 定时触发只会在默认分支 (main) 上生效；合入本文件后才会开始按计划运行。
# 若当天源站尚未发布答案，脚本会报错退出（不会产生提交），
# 之后可通过 Actions 页面手动 "Run workflow" 重跑。

name: Daily Pinpoint Data Update

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30
    - cron: "30 8 * * *"
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pinpoint
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/update/requirements.txt

      - name: Install dependencies
        run: pip install -r data/update/requirements.txt

      - name: Fetch today's Pinpoint answer
        env:
          # 可选：配置该 secret 后用 AI 生成 clueHint；未配置时脚本自动使用 fallback 模板
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python data/update/update_pinpoint.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- data/answers/pinpoint.ts; then
            echo "数据无变化，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/answers/pinpoint.ts
          git commit -m "chore(data): auto-update pinpoint answer $(date -u +%Y-%m-%d)"
          git push origin main
